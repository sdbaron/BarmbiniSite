# Nginx-Konfiguration für barmbini.de (mit HTTPS via Let's Encrypt)
# Stand: 2026-08-20 – entspricht dem Live-Stand auf /etc/nginx/sites-available/barmbini
#   - Security-Header (HSTS, X-Frame-Options, X-Content-Type-Options, Referrer-Policy, Permissions-Policy)
#   - server_tokens off (nginx-Versionsangabe verborgen)
#   - XML-RPC-Block (Brute-Force-Vektor, wird nicht benötigt)
#   - client_max_body_size 256M (für große Medien-/Plugin-Uploads)
#   - www.barmbini.de → 301 auf https://barmbini.de
#   - HTTP → 301 auf HTTPS (Certbot-Blöcke unten)

server {
    server_name barmbini.de;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    server_tokens off;

    root /var/www/barmbini;
    index index.php index.html;
    client_max_body_size 256M;

    access_log /var/log/nginx/barmbini_access.log;
    error_log /var/log/nginx/barmbini_error.log;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # XML-RPC blockieren (Brute-Force-Vektor, wird nicht benötigt)
    location = /xmlrpc.php {
        deny all;
        return 403;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/barmbini.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/barmbini.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    server_name www.barmbini.de;
    return 301 https://barmbini.de$request_uri;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/barmbini.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/barmbini.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = barmbini.de) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name barmbini.de;
    return 404; # managed by Certbot
}

server {
    if ($host = www.barmbini.de) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name www.barmbini.de;
    return 404; # managed by Certbot
}
